<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Пример сохранённой страницы</title>
  <style>body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; }</style>
</head>
<body>
  <article>
    <h1>План поездки</h1>
    <p>В субботу запланирована поездка в соседний город. Выезд — в 09:00, возвращение — в 20:00.</p>
    <h2>Что взять</h2>
    <ul><li>Документы</li><li>Зарядку для телефона</li><li>Воду</li></ul>
    <table>
      <tr><th>Расход</th><th>Сумма</th></tr>
      <tr><td>Транспорт</td><td>500</td></tr>
      <tr><td>Обед</td><td>700</td></tr>
    </table>
    <p>Этот текст нужен для проверки загрузчика сохранённых HTML-страниц.</p>
  </article>
</body>
</html>
