[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-doc-analysis"
version = "0.2.0"
description = "Multi-agent document analysis backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "gigachat>=0.1.39,<1",
    "langgraph>=0.2,<2",
    "pydantic>=2.8,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
